<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Читалка комиксов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            touch-action: pan-y pinch-zoom; /* разрешаем вертикальный скролл и зум */
        }
        .reader {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100vw;
            padding: 10px;
        }
        .page-container {
            position: relative;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .page-container img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: opacity 0.2s ease;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #333;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 100px;
        }
        button:hover {
            background: #555;
        }
        button:active {
            background: #777;
        }
        button:disabled {
            opacity: 0.3;
            cursor: default;
            background: #333;
        }
        .page-number {
            color: #ccc;
            font-size: 16px;
            min-width: 60px;
            text-align: center;
        }
        /* Индикация загрузки */
        .loading {
            color: #aaa;
            font-size: 18px;
        }
        @media (max-width: 500px) {
            button {
                padding: 10px 20px;
                font-size: 16px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="reader">
        <div class="page-container" id="pageContainer">
            <!-- Сюда будет вставлено изображение -->
            <div class="loading" id="loadingMsg">Загрузка...</div>
        </div>
        <div class="nav">
            <button id="prevBtn" disabled>← Назад</button>
            <span class="page-number" id="pageIndicator">0 / 0</span>
            <button id="nextBtn">Вперёд →</button>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ: список твоих страниц комикса
        // Просто перечисли имена файлов, которые лежат
        // в той же папке, что и index.html (или в подпапке)
        // ==========================================
        const pages = [
    'Pages/page1.jpg',
    'Pages/page2.jpg',
    'Pages/page3.jpg',
    'Pages/page4.jpg'
            // добавь столько, сколько нужно
        ];

        // ----- Дальше можно ничего не трогать -----
        const pageImg = document.createElement('img');
        const pageContainer = document.getElementById('pageContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const loadingMsg = document.getElementById('loadingMsg');

        let currentPage = 0;
        const totalPages = pages.length;

        if (totalPages === 0) {
            loadingMsg.textContent = 'Нет страниц. Добавь файлы в массив pages.';
            nextBtn.disabled = true;
        }

        function updateButtons() {
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);
            pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
        }

        function loadPage(index) {
            if (index < 0 || index >= totalPages) return;
            currentPage = index;
            updateButtons();

            // Показываем индикатор загрузки, скрываем картинку
            pageImg.style.display = 'none';
            loadingMsg.style.display = 'block';

            // Предзагрузка изображения
            const img = new Image();
            img.onload = function() {
                pageImg.src = pages[currentPage];
                pageImg.style.display = 'block';
                loadingMsg.style.display = 'none';
                // Если img ещё не добавлен в контейнер
                if (!pageContainer.contains(pageImg)) {
                    pageContainer.innerHTML = ''; // очищаем loadingMsg
                    pageContainer.appendChild(pageImg);
                }
            };
            img.onerror = function() {
                loadingMsg.textContent = 'Ошибка загрузки страницы';
                pageImg.style.display = 'none';
            };
            img.src = pages[currentPage];
        }

        function goNext() {
            if (currentPage < totalPages - 1) {
                loadPage(currentPage + 1);
            }
        }

        function goPrev() {
            if (currentPage > 0) {
                loadPage(currentPage - 1);
            }
        }

        // Кнопки
        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);

        // Клавиши
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goPrev();
            }
        });

        // Свайпы для телефона
        let touchStartX = 0;
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // Горизонтальный свайп должен быть явно больше вертикального
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                if (diffX < 0) {
                    goNext();
                } else {
                    goPrev();
                }
            }
        });

        // Старт
        if (totalPages > 0) {
            loadPage(0);
        } else {
            loadingMsg.textContent = 'Добавь страницы комикса в массив pages.';
        }
    </script>
</body>
</html>
